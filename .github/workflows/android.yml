name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # UbuntuランナーはGitHub ActionsでAction minutesの消費が少なくコストパフォーマンスに優れています。
    # 現在のubuntu-latestはKVM(ハードウェア仮想化)をサポートしているため、エミュレータも比較的高速に動作します。
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Remove strict JVM daemon properties to use setup-java JDK
      run: rm -f gradle/gradle-daemon-jvm.properties

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest -Porg.gradle.java.installations.auto-download=false

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: '37.0'
        target: google_apis
        arch: x86_64
        profile: pixel_6
        ram-size: 2048M
        heap-size: 512M
        disk-size: 4096M
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: ./gradlew connectedAndroidTest -Porg.gradle.java.installations.auto-download=false
